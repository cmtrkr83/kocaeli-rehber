services:
  rehber41:
    image: nginx:alpine
    container_name: rehber41
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - /opt/kocaeli-rehber:/usr/share/nginx/html:ro
      - /opt/kocaeli-rehber/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
