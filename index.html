<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Okul Rehberi" />
  <meta name="theme-color" content="#171513" />
  <title>Kurum & Yönetici Rehberi</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg: #f4f2ee;
      --surface: #ffffff;
      --ink: #171513;
      --ink-2: #66625b;
      --ink-3: #8d8880;
      --line: rgba(23, 21, 19, 0.10);
      --header: #171513;
      --header-ink: #f6f4f0;
      --accent: #128c7e;
      --accent-press: #0e7569;
      --soft: #f2f0ec;
      --radius-card: 16px;
      --radius-ctl: 12px;
      --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; background: var(--bg); }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100dvh;
      overscroll-behavior-y: none;
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
    }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .ico { width: 18px; height: 18px; display: block; flex: none; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    /* App bar */
    .app-bar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--header);
      padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .search-row {
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 688px;
      margin: 0 auto;
    }
    .search-field {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      align-items: center;
    }
    .search-field .search-icon {
      position: absolute;
      left: 12px;
      color: var(--ink-2);
      pointer-events: none;
    }
    .search-field input {
      width: 100%;
      height: 44px;
      padding: 0 40px 0 38px;
      border: 1px solid transparent;
      border-radius: var(--radius-ctl);
      background: #fff;
      color: var(--ink);
      font-size: 16px;
      outline: none;
      appearance: none;
    }
    .search-field input::placeholder { color: var(--ink-2); }
    .search-field input:focus {
      box-shadow: 0 0 0 3px rgba(18, 140, 126, 0.35);
    }
    .clear-btn {
      position: absolute;
      right: 2px;
      width: 36px;
      height: 36px;
      display: none;
      place-items: center;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--ink-2);
    }
    .clear-btn.is-visible { display: grid; }

    .icon-btn {
      width: 44px;
      height: 44px;
      flex: none;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: var(--radius-ctl);
      background: rgba(255, 255, 255, 0.07);
      color: var(--header-ink);
      position: relative;
      transition: background-color 0.15s var(--ease), color 0.15s var(--ease);
    }
    .icon-btn:active { background: rgba(255, 255, 255, 0.16); }
    .filter-btn.is-active {
      background: #fff;
      border-color: #fff;
      color: var(--ink);
    }
    .filter-dot {
      position: absolute;
      top: 9px;
      right: 9px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }
    .filter-dot[hidden] { display: none; }

    /* List */
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-card);
      padding: 16px;
      box-shadow: 0 1px 2px rgba(23, 21, 19, 0.04);
    }
    .school {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.35;
    }
    .person {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      font-size: 13px;
      line-height: 18px;
      color: var(--ink-2);
    }
    .person .ico { color: var(--ink-3); }

    .actions {
      display: flex;
      align-items: stretch;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: nowrap;
    }
    .act {
      height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-radius: var(--radius-ctl);
      text-decoration: none;
      font-weight: 500;
      white-space: nowrap;
      min-width: 0;
      transition: background-color 0.15s var(--ease), transform 0.1s var(--ease);
    }
    .act:active { transform: scale(0.98); }
    .act-call {
      flex: 1 1 0;
      padding: 0 10px;
      background: var(--soft);
      border: 1px solid var(--line);
      color: var(--ink);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }
    .act-wa {
      flex: 0 0 44px;
      background: var(--accent);
      color: #fff;
    }
    .act-wa:active { background: var(--accent-press); }
    .act .ico { color: currentColor; }
    .num-compact { display: none; }

    .empty {
      padding: 48px 16px;
      text-align: center;
      color: var(--ink-2);
      font-size: 14px;
      line-height: 1.55;
    }
    .empty-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 4px;
    }
    .more-btn {
      width: 100%;
      height: 48px;
      border-radius: var(--radius-ctl);
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      font-size: 14px;
      font-weight: 500;
    }
    .more-btn:active { background: var(--soft); }

    /* Sheets */
    .sheet {
      position: fixed;
      inset: auto 0 0 0;
      margin: 0 auto;
      width: 100%;
      max-width: 480px;
      max-height: 82dvh;
      padding: 0;
      border: 1px solid var(--line);
      border-bottom: 0;
      border-radius: 18px 18px 0 0;
      background: var(--surface);
      color: var(--ink);
      overflow: hidden;
      box-shadow: 0 -8px 32px rgba(23, 21, 19, 0.16);
    }
    .sheet[open] {
      display: flex;
      flex-direction: column;
      animation: sheet-in 0.24s var(--ease);
    }
    .sheet::backdrop {
      background: rgba(23, 21, 19, 0.42);
      animation: fade-in 0.2s var(--ease);
    }
    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 16px 8px;
    }
    .sheet-head h2 {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
    }
    .sheet-close {
      width: 36px;
      height: 36px;
      flex: none;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 10px;
      background: var(--soft);
      color: var(--ink-2);
    }
    .sheet-close:active { background: #e8e5df; }
    .sheet-body {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 0 8px calc(12px + env(safe-area-inset-bottom));
      overflow-y: auto;
      overscroll-behavior: contain;
    }
    .option,
    .sheet-action {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 48px;
      padding: 0 12px;
      border: 0;
      border-radius: var(--radius-ctl);
      background: transparent;
      text-align: left;
      font-size: 15px;
      color: var(--ink);
    }
    .option:active, .sheet-action:active { background: var(--soft); }
    .option { justify-content: space-between; }
    .option.is-selected { font-weight: 500; }
    .option-check {
      opacity: 0;
      color: var(--accent);
    }
    .option.is-selected .option-check { opacity: 1; }
    .sheet-action { min-height: 52px; padding: 8px 12px; }
    .sheet-note {
      margin: 8px 12px 2px;
      font-size: 12px;
      line-height: 16px;
      color: var(--ink-3);
    }
    .action-icon {
      width: 32px;
      height: 32px;
      flex: none;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: var(--soft);
      color: var(--ink-2);
    }
    .action-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .action-sub {
      font-size: 12px;
      line-height: 16px;
      color: var(--ink-3);
      overflow-wrap: anywhere;
    }
    .sheet-action[hidden] { display: none; }
    .sheet-action.is-danger,
    .sheet-action.is-danger .action-icon { color: #9d2f27; }
    .sheet-action.is-danger .action-icon { background: #f7ecea; }
    .sheet-action.is-danger:active { background: #f7ecea; }

    @keyframes sheet-in {
      from { transform: translateY(16px); opacity: 0.5; }
      to { transform: none; opacity: 1; }
    }
    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (hover: hover) {
      .icon-btn:hover { background: rgba(255, 255, 255, 0.14); }
      .filter-btn.is-active:hover { background: #f2f0ec; }
      .act-call:hover { background: #ece9e3; }
      .act-wa:hover { background: var(--accent-press); }
      .sheet-close:hover, .option:hover, .sheet-action:hover { background: var(--soft); }
      .more-btn:hover { background: #faf9f7; }
    }

    @media (min-width: 640px) {
      .sheet {
        border-radius: 18px;
        border-bottom: 1px solid var(--line);
        bottom: 24px;
      }
    }

    @media (max-width: 359px) {
      .act-call { font-size: 11.5px; padding: 0 6px; gap: 4px; }
      .act-call .ico { width: 16px; height: 16px; }
      .act-wa { flex-basis: 40px; }
      .num-full { display: none; }
      .num-compact { display: inline; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<header class="app-bar">
  <h1 class="sr-only">Kurum ve yönetici rehberi</h1>
  <div class="search-row">
    <div class="search-field">
      <svg class="ico search-icon" aria-hidden="true"><use href="#i-search" /></svg>
      <input
        type="text"
        id="searchInput"
        placeholder="Rehberde ara"
        aria-label="Rehberde ara"
        autocomplete="off"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
        enterkeyhint="search"
        inputmode="search"
      />
      <button class="clear-btn" id="clearBtn" type="button" aria-label="Aramayı temizle">
        <svg class="ico" aria-hidden="true"><use href="#i-x" /></svg>
      </button>
    </div>
    <button class="icon-btn filter-btn" id="filterBtn" type="button" aria-label="İlçeye göre filtrele" aria-haspopup="dialog">
      <svg class="ico" aria-hidden="true"><use href="#i-funnel" /></svg>
      <span class="filter-dot" id="filterDot" hidden></span>
    </button>
    <button class="icon-btn" id="settingsBtn" type="button" aria-label="Ayarlar" aria-haspopup="dialog">
      <svg class="ico" aria-hidden="true"><use href="#i-cog" /></svg>
    </button>
  </div>
</header>

<main id="list"></main>

<dialog class="sheet" id="filterSheet" aria-labelledby="filterTitle">
  <div class="sheet-head">
    <h2 id="filterTitle">İlçe</h2>
    <button class="sheet-close" type="button" aria-label="Kapat" data-close="filterSheet">
      <svg class="ico" aria-hidden="true"><use href="#i-x" /></svg>
    </button>
  </div>
  <div class="sheet-body" id="districtOptions"></div>
</dialog>

<dialog class="sheet" id="settingsSheet" aria-labelledby="settingsTitle">
  <div class="sheet-head">
    <h2 id="settingsTitle">Ayarlar</h2>
    <button class="sheet-close" type="button" aria-label="Kapat" data-close="settingsSheet">
      <svg class="ico" aria-hidden="true"><use href="#i-x" /></svg>
    </button>
  </div>
  <div class="sheet-body">
    <button class="sheet-action" type="button" data-action="upload">
      <span class="action-icon"><svg class="ico" aria-hidden="true"><use href="#i-upload" /></svg></span>
      Excel yükle
    </button>
    <button class="sheet-action" type="button" data-action="export">
      <span class="action-icon"><svg class="ico" aria-hidden="true"><use href="#i-download" /></svg></span>
      Gömülü HTML indir
    </button>
    <button class="sheet-action" type="button" data-action="backup" id="backupBtn">
      <span class="action-icon"><svg class="ico" aria-hidden="true"><use href="#i-backup" /></svg></span>
      <span class="action-text">
        <span class="action-label" id="backupLabel">Yedek dosyası seç</span>
        <span class="action-sub" id="backupSub">Tarayıcı verisi silinse bile kayıtlar bu dosyada kalır</span>
      </span>
    </button>
    <button class="sheet-action is-danger" type="button" data-action="backup-remove" id="backupRemoveBtn" hidden>
      <span class="action-icon"><svg class="ico" aria-hidden="true"><use href="#i-trash" /></svg></span>
      <span class="action-text"><span class="action-label">Yedek bağlantısını kaldır</span></span>
    </button>
    <p class="sheet-note" id="backupNote">Rehber verisi yalnızca bu cihazda saklanır; sunucuya gönderilmez.</p>
  </div>
</dialog>

<input type="file" id="fileInput" accept=".xlsx,.xls,.csv" hidden />

<script id="embedded-data" type="application/json" data-updated="0">[]</script>

<script>
  const STORAGE_KEY = 'okul_rehberi_data_v1';
  const BACKUP_DB = 'okul_rehberi_backup_v1';
  const BACKUP_STORE = 'files';
  const BACKUP_KEY = 'backupFile';
  const BACKUP_SUPPORTED = typeof window.showSaveFilePicker === 'function';
  let contacts = [];
  let selectedDistrict = 'TÜMÜ';
  let renderLimit = 80;
  let currentUpdatedAtMs = 0;
  let backupHandle = null;
  let backupPermission = 'none';

  function idbOpen() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(BACKUP_DB, 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(BACKUP_STORE)) db.createObjectStore(BACKUP_STORE);
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function idbGet(key) {
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(BACKUP_STORE, 'readonly');
      const req = tx.objectStore(BACKUP_STORE).get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
      tx.oncomplete = () => db.close();
    });
  }

  async function idbSet(key, value) {
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(BACKUP_STORE, 'readwrite');
      tx.objectStore(BACKUP_STORE).put(value, key);
      tx.oncomplete = () => { db.close(); resolve(); };
      tx.onerror = () => reject(tx.error);
    });
  }

  async function idbDel(key) {
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(BACKUP_STORE, 'readwrite');
      tx.objectStore(BACKUP_STORE).delete(key);
      tx.oncomplete = () => { db.close(); resolve(); };
      tx.onerror = () => reject(tx.error);
    });
  }

  const normalizeTR = (val) =>
    String(val || '')
      .trim()
      .toLocaleLowerCase('tr-TR')
      .replace(/ı/g, 'i')
      .replace(/ğ/g, 'g')
      .replace(/ü/g, 'u')
      .replace(/ş/g, 's')
      .replace(/ö/g, 'o')
      .replace(/ç/g, 'c');

  const escapeHtml = (str) =>
    String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');

  const titleCaseTR = (str) => {
    const lower = String(str || '').toLocaleLowerCase('tr-TR');
    return lower.charAt(0).toLocaleUpperCase('tr-TR') + lower.slice(1);
  };

  const parsePhone = (raw) => {
    if (raw === null || raw === undefined) return null;
    let digits = String(raw).replace(/\D/g, '');
    if (digits.startsWith('90') && digits.length === 12) digits = digits.slice(2);
    if (digits.startsWith('0') && digits.length === 11) digits = digits.slice(1);
    if (digits.length !== 10) return null;
    const dial = '0' + digits;
    const formatted = `0${digits.slice(0, 3)} ${digits.slice(3, 6)} ${digits.slice(6, 8)} ${digits.slice(8, 10)}`;
    const isMobile = digits.startsWith('5');
    return { dial, formatted, isMobile, wa: isMobile ? '90' + digits : null };
  };

  async function init() {
    const embeddedEl = document.getElementById('embedded-data');
    const embeddedUpdated = Number(embeddedEl.getAttribute('data-updated') || '0');
    let embeddedList = [];
    try { embeddedList = JSON.parse(embeddedEl.textContent || '[]'); } catch (e) {}

    let savedObj = null;
    try { savedObj = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch (e) {}

    if (savedObj && Array.isArray(savedObj.data) && savedObj.updatedAtMs >= embeddedUpdated) {
      contacts = savedObj.data;
      currentUpdatedAtMs = Number(savedObj.updatedAtMs || 0);
    } else {
      contacts = embeddedList;
      currentUpdatedAtMs = embeddedUpdated;
    }

    buildDistrictOptions();
    render();

    await loadBackupHandle();
    await refreshBackupPermission();
    if (backupHandle && backupPermission === 'granted') {
      const restored = await restoreFromBackupHandle(false);
      if (restored) updateBackupUi();
    }
  }

  function getDistricts() {
    const set = new Set();
    contacts.forEach((c) => {
      if (c.ilce) set.add(String(c.ilce).trim().toLocaleUpperCase('tr-TR'));
    });
    return Array.from(set).sort((a, b) => a.localeCompare(b, 'tr-TR'));
  }

  function buildDistrictOptions() {
    const container = document.getElementById('districtOptions');
    const options = ['TÜMÜ', ...getDistricts()];
    container.innerHTML = options
      .map(
        (d) => `
        <button class="option ${d === selectedDistrict ? 'is-selected' : ''}" type="button" data-district="${escapeHtml(d)}">
          <span class="option-label">${d === 'TÜMÜ' ? 'Tüm ilçeler' : escapeHtml(titleCaseTR(d))}</span>
          <svg class="ico option-check" aria-hidden="true"><use href="#i-check" /></svg>
        </button>`
      )
      .join('');
    updateFilterButton();
  }

  function updateFilterButton() {
    const active = selectedDistrict !== 'TÜMÜ';
    document.getElementById('filterBtn').classList.toggle('is-active', active);
    document.getElementById('filterDot').hidden = !active;
  }

  function selectDistrict(district) {
    selectedDistrict = district;
    renderLimit = 80;
    buildDistrictOptions();
    closeSheet('filterSheet');
    render();
  }

  function openSheet(id) {
    const sheet = document.getElementById(id);
    if (!sheet) return;
    if (typeof sheet.showModal === 'function') sheet.showModal();
    else sheet.setAttribute('open', '');
  }

  function closeSheet(id) {
    const sheet = document.getElementById(id);
    if (!sheet) return;
    if (typeof sheet.close === 'function') sheet.close();
    else sheet.removeAttribute('open');
  }

  function clearSearch() {
    const input = document.getElementById('searchInput');
    input.value = '';
    renderLimit = 80;
    render();
    input.focus();
  }

  function render() {
    const q = normalizeTR(document.getElementById('searchInput').value);
    document.getElementById('clearBtn').classList.toggle('is-visible', Boolean(q));

    const filtered = contacts.filter((c) => {
      const distOk =
        selectedDistrict === 'TÜMÜ' ||
        (c.ilce && String(c.ilce).trim().toLocaleUpperCase('tr-TR') === selectedDistrict);
      if (!distOk) return false;
      if (!q) return true;
      return (
        normalizeTR(c.okul).includes(q) ||
        normalizeTR(c.mdr).includes(q) ||
        normalizeTR(c.ilce).includes(q) ||
        String(c.tel || '').includes(q) ||
        String(c.cep || '').includes(q)
      );
    });

    const listEl = document.getElementById('list');
    if (filtered.length === 0) {
      listEl.innerHTML = contacts.length
        ? `<div class="empty"><div class="empty-title">Eşleşen kayıt bulunamadı</div>Aramayı veya ilçe filtresini değiştirin.</div>`
        : `<div class="empty"><div class="empty-title">Henüz kayıt yok</div>Ayarlar menüsünden bir Excel dosyası yükleyin.</div>`;
      return;
    }

    const slice = filtered.slice(0, renderLimit);
    let html = slice
      .map((c) => {
        const landline = parsePhone(c.tel);
        const mobile = parsePhone(c.cep);
        const waTarget = mobile && mobile.wa;
        const district = c.ilce ? String(c.ilce).trim().toLocaleUpperCase('tr-TR') : '';
        const schoolName = String(c.okul || '').trim();
        let displaySchool = schoolName;
        if (district && schoolName) {
          const match = schoolName.match(/^(.+?)\s*[-–]\s*(.*)$/);
          if (match && normalizeTR(match[1]) === normalizeTR(district)) {
            displaySchool = match[2].trim() ? district + ' - ' + match[2].trim() : district;
          } else {
            displaySchool = district + ' - ' + schoolName;
          }
        }

        const phoneButton = (phone, icon, label) =>
          phone
            ? `<a class="act act-call" href="tel:${phone.dial}" aria-label="${label} ${phone.formatted}">
                 <svg class="ico" aria-hidden="true"><use href="#${icon}" /></svg>
                 <span class="num-full">${phone.formatted}</span><span class="num-compact">${phone.dial}</span>
               </a>`
            : '';

        return `
        <article class="card">
          <div class="school">${escapeHtml(displaySchool)}</div>
          <div class="person">
            <svg class="ico" aria-hidden="true"><use href="#i-user" /></svg>
            <span>${escapeHtml(c.mdr || 'Belirtilmemiş')}</span>
          </div>
          <div class="actions">
            ${phoneButton(landline, 'i-phone', 'Sabit telefonu ara')}
            ${phoneButton(mobile, 'i-mobile', 'Cep telefonunu ara')}
            ${waTarget
              ? `<a class="act act-wa" href="https://wa.me/${waTarget}" target="_blank" rel="noopener" aria-label="WhatsApp ile yaz">
                   <svg class="ico" aria-hidden="true"><use href="#i-whatsapp" /></svg>
                 </a>`
              : ''}
          </div>
        </article>`;
      })
      .join('');

    if (filtered.length > renderLimit) {
      html += `<button class="more-btn" type="button" onclick="showMore()">Daha fazla göster (${filtered.length - renderLimit} kayıt)</button>`;
    }
    listEl.innerHTML = html;
  }

  function showMore() {
    renderLimit += 120;
    render();
  }

  function pickFile() {
    closeSheet('settingsSheet');
    document.getElementById('fileInput').click();
  }

  function updateBackupUi() {
    const btn = document.getElementById('backupBtn');
    const label = document.getElementById('backupLabel');
    const sub = document.getElementById('backupSub');
    const removeBtn = document.getElementById('backupRemoveBtn');
    const note = document.getElementById('backupNote');
    if (!btn || !label || !sub || !removeBtn || !note) return;

    if (!BACKUP_SUPPORTED) {
      btn.hidden = true;
      removeBtn.hidden = true;
      note.textContent = 'Bu tarayıcı otomatik yedek dosyasını desteklemiyor (Safari). Verini korumak için "Gömülü HTML indir" ile yedek al.';
      return;
    }

    note.textContent = 'Rehber verisi yalnızca bu cihazda saklanır; sunucuya gönderilmez.';
    btn.hidden = false;

    if (!backupHandle) {
      label.textContent = 'Yedek dosyası seç';
      sub.textContent = 'Tarayıcı verisi silinse bile kayıtlar bu dosyada kalır';
      removeBtn.hidden = true;
      return;
    }

    removeBtn.hidden = false;
    const stateText = {
      granted: 'bağlı',
      prompt: 'izin bekliyor',
      denied: 'izin verilmedi',
    }[backupPermission] || 'bağlı';

    label.textContent = backupPermission === 'granted' ? 'Yedek dosyasını değiştir' : 'Yedeğe yeniden bağlan';
    sub.textContent = `${backupHandle.name} · ${stateText}`;
  }

  async function loadBackupHandle() {
    if (!BACKUP_SUPPORTED || !('indexedDB' in window)) return;
    try {
      const stored = await idbGet(BACKUP_KEY);
      if (stored && typeof stored.queryPermission === 'function' && typeof stored.getFile === 'function') {
        backupHandle = stored;
      }
    } catch (e) {}
  }

  async function refreshBackupPermission() {
    if (!backupHandle) {
      backupPermission = 'none';
      updateBackupUi();
      return;
    }
    try {
      backupPermission = await backupHandle.queryPermission({ mode: 'readwrite' });
    } catch (e) {
      backupPermission = 'denied';
    }
    updateBackupUi();
  }

  async function requestBackupPermission() {
    if (!backupHandle) return false;
    try {
      backupPermission = await backupHandle.requestPermission({ mode: 'readwrite' });
    } catch (e) {
      backupPermission = 'denied';
    }
    updateBackupUi();
    return backupPermission === 'granted';
  }

  async function inspectBackupFile() {
    const file = await backupHandle.getFile();
    if (!file.size) return { status: 'empty', obj: null };
    let obj = null;
    try { obj = JSON.parse(await file.text()); } catch (e) {}
    if (obj && Array.isArray(obj.data)) return { status: 'valid', obj };
    return { status: 'invalid', obj: null };
  }

  function applyBackup(obj) {
    contacts = obj.data;
    currentUpdatedAtMs = Number(obj.updatedAtMs || 0) || Date.now();
    selectedDistrict = 'TÜMÜ';
    renderLimit = 80;
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ data: contacts, updatedAtMs: currentUpdatedAtMs }));
    buildDistrictOptions();
    render();
  }

  async function writeBackup(updatedAtMs) {
    if (!backupHandle) return false;
    if (backupPermission !== 'granted') return false;
    const stamp = Number(updatedAtMs) || Date.now();
    const payload = { app: 'kocaeli-rehber', version: 1, updatedAtMs: stamp, data: contacts };
    const writable = await backupHandle.createWritable();
    await writable.write(JSON.stringify(payload, null, 2));
    await writable.close();
    updateBackupUi();
    return true;
  }

  async function restoreFromBackupHandle(force) {
    if (!backupHandle) return 0;
    try {
      if (backupPermission !== 'granted') return 0;
      const inspected = await inspectBackupFile();
      if (inspected.status !== 'valid') return 0;
      const obj = inspected.obj;
      if (!obj.data.length && contacts.length) return 0;
      const stamp = Number(obj.updatedAtMs || 0);
      if (!force && !(stamp > currentUpdatedAtMs)) return 0;
      applyBackup(obj);
      return obj.data.length;
    } catch (e) {
      return 0;
    }
  }

  async function chooseBackupFile() {
    if (!BACKUP_SUPPORTED) return;
    let handle;
    try {
      handle = await window.showSaveFilePicker({
        suggestedName: 'rehber-yedek.json',
        types: [{ description: 'Rehber yedeği', accept: { 'application/json': ['.json'] } }],
      });
    } catch (err) {
      if (err && err.name === 'AbortError') return;
      alert('Yedek dosyası seçilemedi: ' + (err && (err.message || err.name) ? err.message || err.name : 'bilinmeyen hata'));
      return;
    }

    backupHandle = handle;
    backupPermission = 'granted';
    try { await idbSet(BACKUP_KEY, handle); } catch (e) {}

    let inspected = { status: 'empty', obj: null };
    try { inspected = await inspectBackupFile(); } catch (e) {}

    if (inspected.status === 'invalid') {
      const overwrite = confirm('Seçilen dosya bir rehber yedeği değil. Üzerine yazılsın mı?');
      if (!overwrite) {
        backupHandle = null;
        backupPermission = 'none';
        try { await idbDel(BACKUP_KEY); } catch (e) {}
        updateBackupUi();
        return;
      }
    }

    if (inspected.status === 'valid' && inspected.obj.data.length) {
      const count = inspected.obj.data.length;
      const useBackup = !contacts.length || confirm(`Seçilen dosyada ${count} kayıt var. Bu kayıtlar cihaza yüklensin mi?\n\nİptal: mevcut ${contacts.length} kayıt dosyaya yazılır.`);
      if (useBackup) {
        applyBackup(inspected.obj);
        updateBackupUi();
        alert(`${count} kayıt yedek dosyasından geri yüklendi.`);
        return;
      }
    }

    try {
      await writeBackup(Date.now());
      updateBackupUi();
      alert(contacts.length
        ? 'Yedek dosyası bağlandı. Her Excel yüklemesinde güncellenecek.'
        : 'Yedek dosyası bağlandı. Excel yüklediğinde kayıtlar bu dosyaya yazılacak.');
    } catch (err) {
      alert('Yedek dosyasına yazılamadı: ' + (err && err.message ? err.message : 'bilinmeyen hata'));
    }
  }

  async function onBackupAction() {
    if (!BACKUP_SUPPORTED) return;
    if (backupHandle && backupPermission !== 'granted') {
      const granted = await requestBackupPermission();
      if (!granted) {
        alert('Yedek dosyasına erişim izni verilmedi. Tarayıcı ayarlarından izin verebilirsin.');
        return;
      }
      const restored = await restoreFromBackupHandle(false);
      alert(restored
        ? `${restored} kayıt yedek dosyasından geri yüklendi.`
        : 'Yedek dosyası yeniden bağlandı.');
      return;
    }
    chooseBackupFile();
  }

  async function removeBackupHandle() {
    backupHandle = null;
    backupPermission = 'none';
    try { await idbDel(BACKUP_KEY); } catch (e) {}
    updateBackupUi();
    alert('Yedek dosyası bağlantısı kaldırıldı. Dosyadaki kayıtlar silinmedi.');
  }

  document.getElementById('searchInput').addEventListener('input', () => {
    renderLimit = 80;
    render();
  });

  document.getElementById('clearBtn').addEventListener('click', clearSearch);
  document.getElementById('filterBtn').addEventListener('click', () => openSheet('filterSheet'));
  document.getElementById('settingsBtn').addEventListener('click', () => {
    openSheet('settingsSheet');
    refreshBackupPermission();
  });

  document.querySelectorAll('[data-close]').forEach((btn) => {
    btn.addEventListener('click', () => closeSheet(btn.dataset.close));
  });

  document.querySelectorAll('dialog.sheet').forEach((sheet) => {
    sheet.addEventListener('click', (e) => {
      if (e.target === sheet) sheet.close();
    });
  });

  document.getElementById('districtOptions').addEventListener('click', (e) => {
    const option = e.target.closest('[data-district]');
    if (option) selectDistrict(option.dataset.district);
  });

  document.querySelector('[data-action="upload"]').addEventListener('click', pickFile);
  document.querySelector('[data-action="export"]').addEventListener('click', exportEmbeddedHtml);
  document.querySelector('[data-action="backup"]').addEventListener('click', onBackupAction);
  document.querySelector('[data-action="backup-remove"]').addEventListener('click', removeBackupHandle);
  updateBackupUi();

  document.getElementById('fileInput').addEventListener('change', function (e) {
    const file = e.target.files[0];
    if (!file) return;
    if (typeof XLSX === 'undefined') {
      alert('Excel okuyucu yüklenemedi. İlk yükleme sırasında internet bağlantısı gerekir.');
      return;
    }

    const reader = new FileReader();
    reader.onload = function (evt) {
      try {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });

        const parsed = [];
        rows.forEach((row, idx) => {
          const m = {};
          Object.keys(row).forEach((k) => { m[normalizeTR(k)] = row[k]; });
          const okul = String(m.okul || m.kurum || '').trim();
          const mdr = String(m.mdr || m.mudur || m.kisi || '').trim();
          const ilce = String(m.ilce || '').trim();
          const tel = String(m.tel || m.telefon || '').trim();
          const cep = String(m.cep || m.gsm || '').trim();
          if (okul || mdr) {
            parsed.push({ sno: m.sno || idx + 1, okul, mdr, ilce, tel, cep });
          }
        });

        if (!parsed.length) {
          alert('Excel içinde geçerli satır bulunamadı.');
          return;
        }

        contacts = parsed;
        selectedDistrict = 'TÜMÜ';
        renderLimit = 80;
        currentUpdatedAtMs = Date.now();
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ data: contacts, updatedAtMs: currentUpdatedAtMs }));
        buildDistrictOptions();
        render();
        alert(parsed.length + ' kayıt rehbere aktarıldı.');
        if (backupHandle && backupPermission === 'granted') {
          writeBackup(currentUpdatedAtMs).catch((err) => {
            alert('Kayıtlar cihaza kaydedildi ancak yedek dosyasına yazılamadı: ' + (err && err.message ? err.message : 'bilinmeyen hata'));
          });
        }
      } catch (err) {
        alert('Dosya okuma hatası: ' + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
    e.target.value = '';
  });

  function exportEmbeddedHtml() {
    if (!contacts.length) {
      alert('Önce bir Excel dosyası yükleyin.');
      return;
    }
    closeSheet('settingsSheet');

    const clone = document.documentElement.cloneNode(true);
    clone.querySelectorAll('link[rel="manifest"], link[rel="apple-touch-icon"], link[rel="icon"]').forEach((el) => el.remove());
    clone.querySelectorAll('dialog').forEach((d) => d.removeAttribute('open'));
    clone.querySelector('#list').innerHTML = '';
    clone.querySelector('#districtOptions').innerHTML = '';
    clone.querySelector('#searchInput').value = '';

    const dataEl = clone.querySelector('#embedded-data');
    dataEl.setAttribute('data-updated', String(Date.now()));
    dataEl.textContent = JSON.stringify(contacts).replace(/</g, '\\u003c');

    const html = '<!DOCTYPE html>\n' + clone.outerHTML;
    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'index.html';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }

  init();
</script>
</body>
</html>
